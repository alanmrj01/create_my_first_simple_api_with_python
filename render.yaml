services:
  - type: web
    name: minha-api-simples
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: API_SECRET_TOKEN
        sync: false
      - key: FRACTTAL_BASIC_KEY
        sync: false
      - key: FRACTTAL_BASIC_SECRET
        sync: false
      - key: DOCUMENT_GEMINI_API_KEY
        sync: false
      - key: DOCUMENT_OCR_WITH_GEMINI
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: REPORT_UPLOAD_TOKEN
        sync: false
      - key: REPORT_SHARE_SIGNING_SECRET
        sync: false
      - key: REPORT_SHARE_PUBLIC_BASE_URL
        value: "https://conversor-siff.onrender.com"
      - key: REPORT_SHARE_STORAGE_BACKEND
        value: "r2"
      - key: REPORT_SHARE_STORAGE_ENDPOINT_URL
        sync: false
      - key: REPORT_SHARE_STORAGE_REGION
        value: "auto"
      - key: REPORT_SHARE_STORAGE_BUCKET
        sync: false
      - key: REPORT_SHARE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: REPORT_SHARE_STORAGE_SECRET_ACCESS_KEY
        sync: false
